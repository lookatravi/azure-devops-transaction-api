name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-container-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run API tests
        run: python -m pytest -q
      - name: Build container image
        run: docker build -t nz-devops-lab:${{ github.sha }} .
